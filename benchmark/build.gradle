plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.2'
}

dependencies {
    implementation project(':core')
    implementation project(':runtime-disruptor')
    implementation project(':gateway')
    implementation project(':trading-indicators')
    implementation project(':trading-execution')
    implementation project(':trading-strategy')
    implementation project(':pipeline-core')
    implementation project(':pipeline-runtime')

    implementation 'org.openjdk.jmh:jmh-core:1.37'
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

    implementation 'org.slf4j:slf4j-api'
    runtimeOnly 'ch.qos.logback:logback-classic'
}

jmh {
    includes = ['EventBusComparisonBenchmark']
    warmupIterations = 2
    iterations = 3
    fork = 1
    resultFormat = 'JSON'
}
