version: "3.9"

services:
  tradej:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradej-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_OPTS=-XX:+UseZGC -XX:MaxRAMPercentage=75.0
      # Broker credentials (override as needed)
      - DHAN_CLIENT_ID=${DHAN_CLIENT_ID:-}
      - DHAN_ACCESS_TOKEN=${DHAN_ACCESS_TOKEN:-}
      - UPSTOX_API_KEY=${UPSTOX_API_KEY:-}
      - UPSTOX_ACCESS_TOKEN=${UPSTOX_ACCESS_TOKEN:-}
      - ICICI_APP_KEY=${ICICI_APP_KEY:-}
      - ICICI_SECRET_KEY=${ICICI_SECRET_KEY:-}
    volumes:
      - tradej-data:/opt/tradej/data
      - tradej-runtime:/opt/tradej/runtime
      - tradej-logs:/opt/tradej/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  tradej-data:
    driver: local
  tradej-runtime:
    driver: local
  tradej-logs:
    driver: local
