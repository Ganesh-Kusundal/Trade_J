name: CI

on:
  push:
    branches: [main, phase3/position-service, all-broker-support-and-moduler]
  pull_request:
    branches: [main, phase3/position-service, all-broker-support-and-moduler]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run check (compile + all unit + integration tests)
        run: ./gradlew check --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Run production smoke test
        run: ./gradlew :app:productionSmokeTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-module }}
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: true
