name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-and-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit, component, contract tests
        run: ./gradlew test componentTest :app:testFrontend --no-daemon
      - name: Run architecture tests
        run: ./gradlew :architecture-test:architectureTest --no-daemon
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: '**/build/reports/spotbugs/*.html'
      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: '**/build/reports/checkstyle/*.html'

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run parquet integration tests when warehouse present
        run: |
          if [ -f data/historical-equity/universe/nifty500_symbols.parquet ]; then
            ./gradlew :app:integrationTest :data-historical-ingest:test --tests '*Integration*' --no-daemon
          else
            echo "Parquet warehouse not present — skipping integration tests"
          fi
