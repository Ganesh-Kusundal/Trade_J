name: ci

on:
  push:
    branches: [main, all-broker-support-and-moduler]
  pull_request:
    branches: [main, all-broker-support-and-moduler]

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Build jar
        run: ./gradlew :app:bootJar -x test
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: trade-j-app
          path: app/build/libs/trade-j-app.jar
          if-no-files-found: error

  heartbeat:
    name: Heartbeat E2E
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: trade-j-app
      - name: Move jar
        run: mkdir -p app/build/libs && mv trade-j-app.jar app/build/libs/trade-j-app.jar
      - name: Run heartbeat
        run: bash scripts/heartbeat-e2e.sh
        env:
          PORT: 8080

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install
        run: cd trade_j_frontend && pnpm install --frozen-lockfile
      - name: Build
        run: cd trade_j_frontend && pnpm build
      - name: Lint
        run: cd trade_j_frontend && pnpm lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Strategy SDK tests
        run: ./gradlew :trading-strategy:test --no-daemon
      - name: Replay reproducibility tests
        run: ./gradlew :replay-engine:test --tests "com.tradej.replay.engine.ScenarioRunnerReproducibilityTest" --no-daemon
      - name: Frontend Upstox decoder test
        run: cd trade_j_frontend && npx tsx src/tests/upstoxDecoder.test.ts
