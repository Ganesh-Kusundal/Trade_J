include 'mcp-server'
project(':mcp-server').projectDir = file('mcp-server')

// Research modules — excluded by default for faster builds.
// Enable with:  ./gradlew build -Presearch
if (settings.startParameter.projectProperties.containsKey('research')) {
    include 'research-core'
    project(':research-core').projectDir = file('research/core')

    include 'research-lab'
    project(':research-lab').projectDir = file('research/lab')

    include 'research-api'
    project(':research-api').projectDir = file('research/api')
}

// Binance Market Data POC — excluded by default
// Enable with:  ./gradlew build -Pbinance
if (settings.startParameter.projectProperties.containsKey('binance')) {
    include 'binance-market-data-poc'
    project(':binance-market-data-poc').projectDir = file('poc/binance-market-data')
}
