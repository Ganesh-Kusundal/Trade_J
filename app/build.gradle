plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':core')
    implementation project(':pipeline-core')
    implementation project(':broker-api')
    implementation project(':broker-core')
    implementation project(':broker-dhan')
    implementation project(':broker-upstox')
    implementation project(':broker-icici')
    implementation project(':broker-gateway')
    implementation project(':trading-strategy')
    implementation project(':trading-execution')
    implementation project(':runtime-disruptor')
    implementation project(':data-persistence')
    implementation project(':runtime-hotpath')
    implementation project(':data-feature-store')
    implementation project(':gateway')
    implementation project(':trading-scanner')
    implementation project(':trading-institutional-scanner')
    implementation project(':trading-indicators')
    implementation project(':trading-simulation')
    implementation project(':trading-options-analytics')
    implementation project(':data-historical-ingest')
    implementation project(':data-analytics')
    implementation project(':pipeline-runtime')
    implementation project(':replay-engine')
    implementation project(':composition')
    implementation project(':research-lab')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation testFixtures(project(':core'))
    testImplementation testFixtures(project(':runtime-disruptor'))
    testImplementation project(':broker-gateway')
}

bootJar {
    archiveFileName = 'trade-j-app.jar'
}

// ── Frontend build integration ───────────────────────────────────
def frontendDir = file("${rootDir}/trade_j_frontend")
def consoleStaticDir = file("src/main/resources/static/console")

task installFrontend(type: Exec) {
    workingDir frontendDir
    commandLine 'npm', 'install'
    inputs.files "${frontendDir}/package.json", "${frontendDir}/package-lock.json"
    outputs.dir "${frontendDir}/node_modules"
}

task buildFrontend(type: Exec) {
    dependsOn installFrontend
    workingDir frontendDir
    commandLine 'npx', 'vite', 'build'
    inputs.dir "${frontendDir}/src"
    inputs.file "${frontendDir}/vite.config.ts"
    outputs.dir "${frontendDir}/dist"
}

task testFrontend(type: Exec) {
    dependsOn installFrontend
    workingDir frontendDir
    commandLine 'npm', 'run', 'test'
    inputs.dir "${frontendDir}/src"
    inputs.file "${frontendDir}/vite.config.ts"
}

task generateApi(type: Exec) {
    description = 'Regenerates the frontend typed API and gateway-event clients.'
    group = 'build'
    workingDir rootDir
    commandLine 'bash', 'scripts/generate-api-client.sh'
    inputs.file 'openapi.yaml'
    inputs.file 'asyncapi.yaml'
    outputs.dir "${frontendDir}/src/generated"
}

tasks.named('check') {
    dependsOn generateApi
}

// ── Production smoke test (P5) ────────────────────────────────────────
//
// End-to-end smoke test against a fresh `prod` profile boot. Wired by
// PRODUCTION_READINESS.md. Exits non-zero on any failure so CI can
// fail the build before deployment.
tasks.register('productionSmokeTest', Test) {
    description = 'Runs the production smoke test checklist against a prod-profile boot.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'production-smoke'
    }
    shouldRunAfter 'check'
}

task syncFrontend(type: Copy) {
    dependsOn buildFrontend
    from "${frontendDir}/dist"
    into consoleStaticDir
    doLast {
        // Remove old assets that no longer exist in the new build
        def oldAssets = fileTree(consoleStaticDir).matching { exclude 'index.html' }
        def newAssets = fileTree("${frontendDir}/dist").files.collect { it.name }
        oldAssets.each { f ->
            if (!newAssets.contains(f.name)) {
                f.delete()
            }
        }
    }
}

task cleanFrontend(type: Delete) {
    delete "${frontendDir}/dist", consoleStaticDir
}

// Wire into build lifecycle
tasks.named('processResources') {
    dependsOn syncFrontend
}

tasks.named('check') {
    dependsOn testFrontend
}

tasks.named('clean') {
    dependsOn cleanFrontend
}

bootRun {
    workingDir = rootProject.projectDir
}
