spring:
  config:
    import: optional:file:./config/dhan-local.properties

# ─── Dhan LIVE (default production broker) ────────────────────────────────────
trade:
  broker-type: dhan

  broker:
    client-id: ${dhan.clientId:${DHAN_CLIENT_ID:}}
    access-token: ${dhan.accessToken:${DHAN_ACCESS_TOKEN:}}
    environment: LIVE
    rest-base-url: ${dhan.restBaseUrl:}
    auth-mode: ${dhan.authMode:TOTP_GENERATED}
    token-state-file: ${dhan.tokenStateFile:runtime-prod/dhan-token-state.json}
  storage:
    chronicle-path: runtime-prod/chronicle
    duckdb-path: runtime-prod/trade.duckdb
  instruments:
    cache-directory: runtime-prod/instruments

# ─── Upstox LIVE — activate with: --spring.profiles.active=prod,upstox-prod ──
# Merged from application-upstox-prod.yml (deleted).
# To use Upstox in prod, override trade.broker-type=upstox and supply:
#
# trade:
#   broker-type: upstox
#   upstox:
#     client-id: ${upstox.live.clientId}
#     client-secret: ${upstox.live.clientSecret}
#     redirect-uri: ${upstox.live.redirectUri}
#     access-token: ${upstox.live.accessToken:}
#     analytics-token: ${upstox.live.analyticsToken:}
#     analytics-only: false
#     sandbox: false
#     refresh-buffer-ms: 1800000
#     token-expiry-buffer-ms: 600000
#   storage:
#     chronicle-path: runtime-prod/events
#     duckdb-path: runtime-prod/data.db
#
# Credentials file: ./config/upstox-live.properties

