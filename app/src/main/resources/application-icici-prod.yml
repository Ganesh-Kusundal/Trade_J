trade:
  broker-type: icici
  icici:
    appKey: ${ICICI_API_KEY:}
    secretKey: ${ICICI_API_SECRET:}
    authMode: ${ICICI_AUTH_MODE:BROWSER_AUTOMATED}
    totpSecretFile: config/icici-totp-secret.txt
    usernameFile: config/icici-username.txt
    passwordFile: config/icici-password.txt
    apiSessionFile: config/icici-api-session.txt
    tokenStateFile: runtime/icici-token-state.json
    ordersEnabled: true
    refreshBufferMinutes: 10
    loginRedirectPort: 9080
    loginRedirectPath: /api
    browserHeadless: true
    browserLoginTimeoutSeconds: 120
  instruments:
    auto-download: true
    cache-directory: runtime/icici-instruments
  subscriptions:
    - symbol: RELIANCE
      exchange-segment: NSE_EQ
      feed-mode: LTP
