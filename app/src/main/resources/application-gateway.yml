spring:
  config:
    import:
      - optional:file:./config/dhan-local.properties
      - optional:file:./config/icici-local.properties
      - optional:file:./config/upstox-live.properties

trade:
  broker-type: gateway

  # Dhan broker configuration
  broker:
    client-id: ${dhan.clientId:${DHAN_CLIENT_ID:}}
    access-token: ${dhan.accessToken:${DHAN_ACCESS_TOKEN:}}
    environment: LIVE
    rest-base-url: ${dhan.restBaseUrl:}
    auth-mode: ${dhan.authMode:TOTP_GENERATED}
    token-state-file: ${dhan.tokenStateFile:runtime-prod/tokens/dhan-token-state.json}
    pin-file: ${dhan.pinFile:config/dhan-pin.txt}
    totp-secret-file: ${dhan.totpSecretFile:config/dhan-totp-secret.txt}

  # ICICI broker configuration
  icici:
    app-key: ${ICICI_API_KEY:}
    secret-key: ${ICICI_API_SECRET:}
    auth-mode: ${ICICI_AUTH_MODE:BROWSER_AUTOMATED}
    totp-secret-file: config/icici-totp-secret.txt
    username-file: config/icici-username.txt
    password-file: config/icici-password.txt
    api-session-file: config/icici-api-session.txt
    token-state-file: runtime/tokens/icici-token-state.json
    orders-enabled: ${ICICI_ORDERS_ENABLED:false}
    refresh-buffer-minutes: 10
    login-redirect-port: 9080
    login-redirect-path: /api
    browser-headless: true
    browser-login-timeout-seconds: 120

  # Upstox broker configuration
  upstox:
    client-id: ${UPSTOX_CLIENT_ID:}
    client-secret: ${UPSTOX_CLIENT_SECRET:}
    redirect-uri: ${UPSTOX_REDIRECT_URI:}
    access-token: ${UPSTOX_ACCESS_TOKEN:}
    analytics-token: ${UPSTOX_ANALYTICS_TOKEN:}
    analytics-only: false
    sandbox: false

  storage:
    chronicle-path: runtime-prod/chronicle
    duckdb-path: runtime-prod/trade.duckdb
    risk-state-path: runtime-prod/risk-state.json

  instruments:
    cache-directory: runtime-prod/instruments
    auto-download: true

  subscriptions:
    - symbol: NIFTY
      exchange-segment: IDX_I
      feed-mode: TICKER
    - symbol: BANKNIFTY
      exchange-segment: IDX_I
      feed-mode: TICKER
    - symbol: RELIANCE
      exchange-segment: NSE_EQ
      feed-mode: QUOTE
    - symbol: SBIN
      exchange-segment: NSE_EQ
      feed-mode: QUOTE
    - symbol: GOLD
      exchange-segment: MCX_COMM
      feed-mode: TICKER
    - symbol: CRUDEOIL
      exchange-segment: MCX_COMM
      feed-mode: TICKER
    - symbol: SILVER
      exchange-segment: MCX_COMM
      feed-mode: TICKER
    - symbol: NATURALGAS
      exchange-segment: MCX_COMM
      feed-mode: TICKER
