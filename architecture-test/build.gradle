plugins {
    id 'java-library'
}

def coreModules = [
        ':core',
        ':pipeline-core',
        ':broker-api',
        ':broker-core',
        ':broker-dhan',
        ':broker-upstox',
        ':broker-icici',
        ':data-persistence',
        ':data-feature-store',
        ':data-historical-ingest',
        ':data-analytics',
        ':trading-scanner',
        ':trading-execution',
        ':trading-strategy',
        ':trading-simulation',
        ':trading-institutional-scanner',
        ':trading-indicators',
        ':trading-options-analytics',
        ':broker-gateway',
        ':runtime-disruptor',
        ':runtime-hotpath',
        ':pipeline-runtime',
        ':gateway',
        ':cli',
        ':trade-pipeline-platform',
        ':app',
]
def researchModules = [
        ':research-core',
        ':research-lab',
        ':replay-engine',
        ':mcp-server',
        ':research-api',
]
def scannedModules = coreModules + (
        project.hasProperty('research') ? researchModules : []
)

dependencies {
    scannedModules.each { modulePath ->
        testImplementation project(modulePath)
    }
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
    testImplementation 'org.springframework:spring-context'
    testImplementation 'org.springframework.modulith:spring-modulith-test:1.4.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

def moduleClassOutputs = scannedModules.collect { modulePath ->
    project(modulePath).sourceSets.main.output.classesDirs
}

def researchEnabled = project.hasProperty('research')

tasks.withType(Test).configureEach {
    systemProperty 'research', researchEnabled.toString()
}

tasks.named('test', Test).configure {
    useJUnitPlatform {
        includeTags 'architecture'
    }
    maxHeapSize = '1g'
    classpath = files(moduleClassOutputs) + classpath
}

tasks.register('architectureTest', Test) {
    description = 'Runs architecture boundary tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(moduleClassOutputs) + sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'architecture'
    }
    maxHeapSize = '1g'
    dependsOn scannedModules.collect { project(it).tasks.named('classes') }
}
