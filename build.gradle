import groovy.xml.XmlSlurper
import org.gradle.testing.jacoco.plugins.JacocoTaskExtension
import org.gradle.testing.jacoco.tasks.JacocoReport

plugins {
    id 'org.springframework.boot' version '3.4.13' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.github.spotbugs' version '6.5.5' apply false
    id 'checkstyle'
}

ext {
    versions = [
        disruptor     : '4.0.0',
        caffeine      : '3.2.4',
        chronicleQueue: '2026.2',
        duckdb        : '1.5.3.0',
        junitBom      : '5.12.2'
    ]
    chronicleJvmArgs = [
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.nio=ALL-UNNAMED',
        '--add-opens=java.base/java.nio.channels.spi=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED',
        '--add-exports=java.base/jdk.internal.ref=ALL-UNNAMED',
        '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED'
    ]
}

allprojects {
    group = 'com.tradej'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        compileJava.options.compilerArgs.add('-parameters')
        compileTestJava.options.compilerArgs.add('-parameters')
    }

    dependencyLocking {
        lockMode = LockMode.DEFAULT
        // Lock only the configurations that matter for reproducibility.
        // Excludes tool configurations like checkstyle/spotbugs which don't need locking.
        configurations {
            compileClasspath
            runtimeClasspath
            testCompileClasspath
            testRuntimeClasspath
            annotationProcessor
            testAnnotationProcessor
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.13"
        }
    }

    spotbugs {
        toolVersion = '4.9.3'
        ignoreFailures = true
        showProgress = true
        effort = 'default'
        reportLevel = 'medium'
        excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
    }

    // Static analysis is wired into the Gradle `check` lifecycle, so
    // `./gradlew build` runs SpotBugs + Checkstyle on every subproject.
    // This will slow down the default build. To skip static analysis:
    //   ./gradlew build -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest
    // To run static analysis only:
    //   ./gradlew checkstyleMain spotbugsMain

    spotbugsMain {
        reports {
            html {
                required = true
                outputLocation = layout.buildDirectory.file("reports/spotbugs/main.html")
            }
        }
    }

    spotbugsTest {
        reports {
            html {
                required = true
                outputLocation = layout.buildDirectory.file("reports/spotbugs/test.html")
            }
        }
    }

    checkstyle {
        toolVersion = '13.4.2'
        ignoreFailures = true
        showViolations = true
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    }

    checkstyleMain {
        reports {
            html {
                required = true
                outputLocation = layout.buildDirectory.file("reports/checkstyle/main.html")
            }
        }
    }

    checkstyleTest {
        reports {
            html {
                required = true
                outputLocation = layout.buildDirectory.file("reports/checkstyle/test.html")
            }
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs rootProject.ext.chronicleJvmArgs
        systemProperty 'trade.workspace.root', rootProject.projectDir.absolutePath
        // Enable Byte Buddy experimental mode for Java 26 compatibility with Mockito 5.14.2.
        // Remove once Mockito/Byte Buddy officially supports Java 26.
        systemProperty 'net.bytebuddy.experimental', 'true'
    }

    tasks.withType(JavaExec).configureEach {
        jvmArgs rootProject.ext.chronicleJvmArgs
    }

    tasks.named('test', Test).configure {
        useJUnitPlatform {
            excludeTags 'integration'
        }
    }

    tasks.register('unitTest', Test) {
        description = 'Runs unit tests only.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'unit'
        }
        shouldRunAfter tasks.named('test')
    }

    tasks.register('componentTest', Test) {
        description = 'Runs component tests only.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'component'
        }
        shouldRunAfter tasks.named('unitTest')
    }

    tasks.register('integrationTest', Test) {
        description = 'Runs live integration tests only.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'integration'
        }
        shouldRunAfter tasks.named('componentTest')
    }

    tasks.register('brokerRestTest', Test) {
        description = 'Runs live broker REST integration tests.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        maxHeapSize = '4g'
        useJUnitPlatform {
            includeTags 'broker-rest'
            excludeTags 'broker-auth-drill'
        }
        shouldRunAfter tasks.named('componentTest')
    }

    tasks.register('brokerAuthDrillTest', Test) {
        description = 'Manual Dhan TOTP token drill tests (destructive; not part of fullRegressionTest).'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'broker-auth-drill'
        }
    }

    tasks.register('brokerWsTest', Test) {
        description = 'Runs live broker websocket integration tests.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        maxHeapSize = '4g'
        useJUnitPlatform {
            includeTags 'broker-ws'
        }
        shouldRunAfter tasks.named('brokerRestTest')
    }

    tasks.register('brokerOrderTest', Test) {
        description = 'Runs live broker order integration tests.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        maxHeapSize = '4g'
        useJUnitPlatform {
            includeTags 'broker-order'
        }
        shouldRunAfter tasks.named('brokerWsTest')
    }

    tasks.register('runtimeE2eTest', Test) {
        description = 'Runs runtime end-to-end integration tests.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        maxHeapSize = '4g'
        useJUnitPlatform {
            includeTags 'runtime-e2e'
        }
        shouldRunAfter tasks.named('brokerOrderTest')
    }

    tasks.register('regressionPreflightTest', Test) {
        description = 'Runs regression preflight credential checks.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'regression-preflight'
        }
        shouldRunAfter tasks.named('componentTest')
    }

    tasks.register('upstoxPreflightTest', Test) {
        description = 'Runs Upstox credential and analytics REST smoke tests (tag: upstox-preflight).'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'upstox-preflight'
        }
        shouldRunAfter tasks.named('componentTest')
    }

    tasks.register('crossLayerRegressionTest', Test) {
        description = 'Runs cross-layer OMS and execution integration tests.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        maxHeapSize = '4g'
        useJUnitPlatform {
            includeTags 'cross-layer'
        }
        shouldRunAfter tasks.named('brokerOrderTest')
    }

    tasks.register('chaosTest', Test) {
        description = 'Runs chaos/resilience tests (WebSocket kills, reconnect storms, network partitions).'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'chaos'
        }
        shouldRunAfter tasks.named('crossLayerRegressionTest')
    }

    tasks.register('brokerParityTest') {
        description = 'Runs full Tradehull parity verification suite.'
        group = 'verification'
        dependsOn tasks.named('brokerRestTest')
        dependsOn tasks.named('brokerWsTest')
        dependsOn tasks.named('brokerOrderTest')
        dependsOn tasks.named('runtimeE2eTest')
    }

    tasks.withType(Test).configureEach {
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            xml.required = true
            html.required = true
            csv.required = true
        }
    }

    tasks.register('coverageReport') {
        description = 'Runs unit tests and generates Jacoco XML/HTML/CSV coverage reports.'
        group = 'verification'
        dependsOn tasks.named('test'), tasks.named('jacocoTestReport')
    }

    tasks.register('coverageAudit') {
        description = 'Fails when executable coverage reports are missing.'
        group = 'verification'
        dependsOn tasks.named('coverageReport')
        doLast {
            def reportDir = layout.buildDirectory.dir('reports/jacoco')
            def xmlReport = reportDir.get().file('test/jacocoTestReport.xml').asFile
            def htmlIndex = reportDir.get().file('test/index.html').asFile
            def csvReport = reportDir.get().file('test/jacocoTestReport.csv').asFile
            def execData = layout.buildDirectory.file('jacoco/test.exec').get().asFile
            def missing = []
            [xmlReport, htmlIndex, csvReport, execData].each { file ->
                if (!file.isFile() || file.length() == 0L) {
                    missing << file.path
                }
            }
            if (!missing.isEmpty()) {
                throw new GradleException("Coverage audit failed; missing or empty executable reports: ${missing.join(', ')}")
            }
        }
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${versions.junitBom}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

tasks.register('fullRegressionTest') {
    description = 'Runs full-stack regression: unit, component, preflight, broker, runtime, cross-layer, chaos.'
    group = 'verification'
    dependsOn subprojects.collect { project ->
        project.tasks.matching { it.name == 'unitTest' || it.name == 'componentTest' }
    }
    dependsOn ':app:regressionPreflightTest'
    dependsOn ':app:brokerRestTest'
    dependsOn ':app:brokerWsTest'
    dependsOn ':app:brokerOrderTest'
    dependsOn ':app:runtimeE2eTest'
    dependsOn ':app:crossLayerRegressionTest'
    dependsOn ':app:chaosTest'
}

def jacocoProjects = subprojects.findAll { it.plugins.hasPlugin('jacoco') }

tasks.register('coverageReportAll') {
    description = 'Runs unit tests and generates Jacoco coverage reports for every subproject.'
    group = 'verification'
    dependsOn jacocoProjects.collect { project -> project.tasks.named('coverageReport') }
}

tasks.register('coverageAuditAll') {
    description = 'Runs executable coverage reports and fails if any subproject report is missing or empty.'
    group = 'verification'
    dependsOn jacocoProjects.collect { project -> project.tasks.named('coverageAudit') }
}

tasks.register('coverageAuditSummary') {
    description = 'Builds a root-level coverage audit summary from executable Jacoco XML reports.'
    group = 'verification'
    dependsOn tasks.named('coverageReportAll')
    doLast {
        def outDir = layout.buildDirectory.dir('reports/coverage-audit').get().asFile
        outDir.mkdirs()
        def uncoveredClasses = []
        def uncoveredMethods = []
        def uncoveredLines = []
        def zeroInstructionClasses = []
        def zeroBranchClasses = []
        jacocoProjects.each { project ->
            def report = project.layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile
            if (!report.isFile()) {
                return
            }
            def xml = new XmlSlurper(false, false).parse(report)
            def projectName = project.path
            xml.packagefile.each { pkg ->
                def pkgName = pkg.@name.toString()
                pkg.classfile.each { cls ->
                    def className = cls.@name.toString()
                    def fqn = "${projectName}:${pkgName}.${className}".replace('/', '.')
                    def counters = [:]
                    cls.counter.each { counter ->
                        counters[counter.@type.toString()] = counter
                    }
                    def instr = counters['INSTRUCTION']
                    def line = counters['LINE']
                    def branch = counters['BRANCH']
                    def lineCovered = line ? line.@covered.toInteger() : 0
                    def instrCovered = instr ? instr.@covered.toInteger() : 0
                    def branchCovered = branch ? branch.@covered.toInteger() : 0
                    def instrMissed = instr ? instr.@missed.toInteger() : 0
                    def lineMissed = line ? line.@missed.toInteger() : 0
                    def branchMissed = branch ? branch.@missed.toInteger() : 0
                    if (instrCovered == 0 && lineCovered == 0 && instrMissed > 0) {
                        uncoveredClasses << [projectName, fqn, instrMissed, lineMissed, branchMissed]
                    }
                    if (instr && instr.@missed.toInteger() > 0 && instr.@covered.toInteger() == 0) {
                        zeroInstructionClasses << [projectName, fqn, instrMissed]
                    }
                    if (branch && branch.@missed.toInteger() > 0 && branch.@covered.toInteger() == 0) {
                        zeroBranchClasses << [projectName, fqn, branchMissed]
                    }
                    cls.method.each { method ->
                        def methodName = method.@name.toString()
                        def methodDesc = method.@desc.toString()
                        def methodCounters = [:]
                        method.counter.each { counter ->
                            methodCounters[counter.@type.toString()] = counter
                        }
                        def methodLine = methodCounters['LINE']
                        def methodInstr = methodCounters['INSTRUCTION']
                        def methodBranch = methodCounters['BRANCH']
                        def methodLineCovered = methodLine ? methodLine.@covered.toInteger() : 0
                        def methodInstrCovered = methodInstr ? methodInstr.@covered.toInteger() : 0
                        def methodInstrMissed = methodInstr ? methodInstr.@missed.toInteger() : 0
                        if (methodLineCovered == 0 && methodInstrCovered == 0 && methodInstrMissed > 0) {
                            uncoveredMethods << [projectName, fqn, methodName, methodDesc, methodInstrMissed]
                        }
                    }
                    cls.method.each { method ->
                        def methodName = method.@name.toString()
                        def methodDesc = method.@desc.toString()
                        def methodLines = []
                        method.line.each { lineNode ->
                            def nr = lineNode.@nr.toInteger()
                            def mi = lineNode.@mi.toInteger()
                            def mb = lineNode.@mb.toInteger()
                            if (mi > 0 || mb > 0) {
                                methodLines << "${nr}(mi=${mi},mb=${mb})"
                            }
                        }
                        if (!methodLines.isEmpty()) {
                            uncoveredLines << [projectName, fqn, methodName, methodDesc, methodLines.join(';')]
                        }
                    }
                }
            }
        }
        def csv = { rows ->
            rows.collect { row -> row.collect { it.toString().replace('"', '""') }.collect { "\"${it}\"" }.join(',') }.join('\n')
        }
        new File(outDir, 'uncovered-classes.csv').text = "project,class,instruction_missed,line_missed,branch_missed\n" + csv(uncoveredClasses)
        new File(outDir, 'uncovered-methods.csv').text = "project,class,method,descriptor,instruction_missed\n" + csv(uncoveredMethods)
        new File(outDir, 'uncovered-lines.csv').text = "project,class,method,descriptor,lines\n" + csv(uncoveredLines)
        new File(outDir, 'zero-instruction-classes.csv').text = "project,class,instruction_missed\n" + csv(zeroInstructionClasses)
        new File(outDir, 'zero-branch-classes.csv').text = "project,class,branch_missed\n" + csv(zeroBranchClasses)
        def summary = """coverage audit summary
projects: ${jacocoProjects.size()}
uncovered classes: ${uncoveredClasses.size()}
uncovered methods: ${uncoveredMethods.size()}
classes with uncovered lines: ${uncoveredLines.size()}
zero-instruction classes: ${zeroInstructionClasses.size()}
zero-branch classes: ${zeroBranchClasses.size()}
reports: ${outDir.absolutePath}
"""
        new File(outDir, 'summary.txt').text = summary
        println summary
    }
}

// ── P10: Auto-generate architecture diagrams ──────────────────────────

tasks.register('generateArchitectureDiagram') {
    group = 'documentation'
    description = 'Generates a Mermaid module dependency diagram from the Gradle project structure'

    doLast {
        def outDir = file('docs/architecture')
        outDir.mkdirs()

        def lines = []
        lines << '# Module Dependency Graph'
        lines << ''
        lines << 'Auto-generated from `settings.gradle` and subproject `build.gradle` files.'
        lines << ''
        lines << '```mermaid'
        lines << 'graph TD'

        def projectDeps = [:]
        def allProjectNames = []

        subprojects.each { sub ->
            allProjectNames << sub.name
        }

        subprojects.each { sub ->
            def deps = new LinkedHashSet<String>()
            sub.configurations.each { config ->
                config.allDependencies.withType(org.gradle.api.artifacts.ProjectDependency).each { dep ->
                    deps << dep.path.replace(':', '').replaceFirst('^', '')
                }
            }
            def depNames = []
            deps.each { d ->
                def name = d.toString()
                if (name.startsWith(':')) name = name.substring(1)
                depNames << name
            }
            projectDeps[sub.name] = depNames
        }

        allProjectNames.sort().each { name ->
            def safeName = name.replace('-', '_')
            def label = name
            def group = 'other'
            if (name.startsWith('broker')) group = 'broker'
            else if (name.startsWith('trading')) group = 'trading'
            else if (name.startsWith('data')) group = 'data'
            else if (name.startsWith('runtime')) group = 'runtime'
            else if (name.startsWith('pipeline')) group = 'pipeline'
            else if (name == 'app' || name == 'cli' || name == 'gateway') group = 'entry'
            else if (name == 'core') group = 'core'
            lines << "    ${safeName}[\"${label}\"]:::${group}"
        }

        projectDeps.each { from, deps ->
            def safeFrom = from.replace('-', '_')
            deps.sort().each { to ->
                def safeTo = to.replace('-', '_')
                lines << "    ${safeFrom} --> ${safeTo}"
            }
        }

        lines << ''
        lines << '    classDef broker fill:#e1f5fe,stroke:#0288d1'
        lines << '    classDef trading fill:#f3e5f5,stroke:#7b1fa2'
        lines << '    classDef data fill:#e8f5e9,stroke:#388e3c'
        lines << '    classDef runtime fill:#fff3e0,stroke:#f57c00'
        lines << '    classDef pipeline fill:#fce4ec,stroke:#c62828'
        lines << '    classDef entry fill:#fafafa,stroke:#424242'
        lines << '    classDef core fill:#e0f2f1,stroke:#00695c'
        lines << '    classDef other fill:#f5f5f5,stroke:#9e9e9e'
        lines << '```'
        lines << ''

        def outFile = new File(outDir, 'module-dependencies.md')
        outFile.text = lines.join('\n')
        println "Architecture diagram generated: ${outFile.absolutePath}"
    }
}
