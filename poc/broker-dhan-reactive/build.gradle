dependencies {
  api project(':broker-api')
  api project(':broker-core')
  
  // Reactive dependencies
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'io.projectreactor:reactor-core'
  implementation 'io.projectreactor.netty:reactor-netty'
  
  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'org.slf4j:slf4j-api'
  implementation 'com.eatthepath:java-otp:0.4.0'
  
  // Test dependencies
  testImplementation testFixtures(project(':broker-api'))
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'
  testImplementation 'io.projectreactor:reactor-test'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
  testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
  useJUnitPlatform()
  testLogging {
    events 'PASSED', 'FAILED', 'SKIPPED'
    exceptionFormat 'full'
  }
}

// Task to run the standalone data endpoint test
tasks.register('runDataTest', JavaExec) {
  group = 'verification'
  description = 'Run reactive Dhan data endpoints test'
  mainClass = 'com.tradej.broker.dhan.reactive.ReactiveDhanDataTest'
  classpath = sourceSets.main.runtimeClasspath
  standardInput = System.in
}

// Task to run multi-symbol historical load test
tasks.register('runMultiSymbolLoadTest', JavaExec) {
  group = 'verification'
  description = 'Run multi-symbol historical data load test (10 symbols × 30 days)'
  mainClass = 'com.tradej.broker.dhan.reactive.MultiSymbolHistoricalLoadTest'
  classpath = sourceSets.main.runtimeClasspath
}
