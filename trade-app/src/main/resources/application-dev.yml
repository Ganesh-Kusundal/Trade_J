spring:
  config:
    import:
      - optional:file:./config/dhan-local.properties
      - optional:file:./config/dhan-sandbox.properties
  profiles:
    group:
      dev-live:
        - dev
        - dev-live

trade:
  broker:
    client-id: ${dhan.sandbox.clientId}
    access-token: ${dhan.sandbox.accessToken}
    environment: SANDBOX
    rest-base-url: ${dhan.sandbox.restBaseUrl:https://sandbox.dhan.co/v2}
    auth-mode: STATIC
    token-state-file: runtime-dev/dhan-sandbox-token-state.json
  storage:
    chronicle-path: runtime-dev/chronicle
    duckdb-path: runtime-dev/trade.duckdb
  instruments:
    cache-directory: runtime-dev/instruments
