spring:
  application:
    name: trade-j
  config:
    import: optional:file:./config/dhan-local.properties

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

trade:
  broker:
    client-id: ${dhan.clientId:${DHAN_CLIENT_ID:}}
    access-token: ${dhan.accessToken:${DHAN_ACCESS_TOKEN:}}
    environment: ${dhan.environment:LIVE}
    rest-base-url: ${dhan.restBaseUrl:}
    logging-enabled: false
    rate-limit-retries: 3
    max-reconnect-attempts: 10
    auto-reconnect-enabled: true
    auto-resubscribe-enabled: true
    auth-mode: ${dhan.authMode:STATIC}
    refresh-buffer-minutes: ${dhan.refreshBufferMinutes:10}
    pin-file: ${dhan.pinFile:config/dhan-pin.txt}
    totp-secret-file: ${dhan.totpSecretFile:config/dhan-totp-secret.txt}
    token-state-file: ${dhan.tokenStateFile:runtime/dhan-token-state.json}
    option-expiry-cache-ttl-minutes: ${dhan.optionExpiryCacheTtlMinutes:5}
  storage:
    chronicle-path: ${TRADE_CHRONICLE_PATH:runtime/chronicle}
    duckdb-path: ${TRADE_DUCKDB_PATH:runtime/trade.duckdb}
  reconciliation:
    interval-seconds: 300
    initial-delay-seconds: 60
  risk:
    max-daily-loss-paisa: 500000
    max-consecutive-losses: 3
    max-order-value-paisa: 5000000
    max-open-positions: 3
  instruments:
    csv-path: ${TRADE_INSTRUMENTS_CSV:}
    cache-directory: ${TRADE_INSTRUMENTS_CACHE_DIR:runtime/instruments}
    auto-download: ${TRADE_INSTRUMENTS_AUTO_DOWNLOAD:true}
  subscriptions: []
  venues:
    NSE_EQ:
      supported-feed-modes: [TICKER, QUOTE, FULL, DEPTH_20]
      supports-depth-20: true
      supports-depth-200: false
      requires-contract-discovery: false
      session-open: "09:15"
      session-close: "15:30"
      supports-late-session: false
    NSE_FNO:
      supported-feed-modes: [TICKER, QUOTE, FULL, DEPTH_20]
      supports-depth-20: true
      supports-depth-200: false
      requires-contract-discovery: true
      session-open: "09:15"
      session-close: "15:30"
      supports-late-session: false
    BSE_EQ:
      supported-feed-modes: [TICKER, QUOTE, FULL, DEPTH_20]
      supports-depth-20: true
      supports-depth-200: false
      requires-contract-discovery: false
      session-open: "09:15"
      session-close: "15:30"
      supports-late-session: false
    BSE_FNO:
      supported-feed-modes: [TICKER, QUOTE, FULL, DEPTH_20]
      supports-depth-20: true
      supports-depth-200: false
      requires-contract-discovery: true
      session-open: "09:15"
      session-close: "15:30"
      supports-late-session: false
    MCX_COMM:
      supported-feed-modes: [TICKER, QUOTE, FULL, DEPTH_20]
      supports-depth-20: true
      supports-depth-200: false
      requires-contract-discovery: true
      session-open: "09:00"
      session-close: "23:30"
      supports-late-session: true
    IDX_I:
      supported-feed-modes: [TICKER, QUOTE]
      supports-depth-20: false
      supports-depth-200: false
      requires-contract-discovery: false
      session-open: "09:15"
      session-close: "15:30"
      supports-late-session: false
