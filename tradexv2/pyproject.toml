[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradexv2-broker"
version = "0.1.0"
description = "Production-ready, simple, contract-driven python broker framework for TradeXV2"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "polars>=0.20.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["broker*"]
